    <!--
    IMPECCABLE DIRECTION CONTRACT — brief-pinned (structure from option B; palette Borussia
    Dortmund; type Montserrat)
    THESIS: The portfolio is one full-screen map — no scroll, no sections. Every piece of
      information lives on a node; clicking a node opens its pop-up with the full content.
      The interface is the map. Refuses the landing page with linked sections.
    OWN-WORLD: Pure black ground (#000000 / #0C0C0C), bone text (#F2F2F2 / dim #9A9A9A), one
      accent — BVB yellow #FDE100 — rationed to the active node, its lit edges, live markers,
      focus and hover. Hairlines (#222) divide. Montserrat throughout: 700/800 uppercase and
      tracked for the wordmark, node labels and pop-up headers; 400/500 for body. A denser,
      higher-contrast starfield is the visible atmosphere the map floats in. Light theme keeps
      the yellow as fills/markers only, with a readable gold for accent text.
    STORY: A recruiter, a client and a developer open the same screen. They read the map,
      tap MallenK (manifesto), Perfil, Proyectos, Experiencia, Servicios, Contacto — each a
      pop-up carrying that section's full content. Contact's pop-up has the form. Easter eggs
      hide in the map.
    FIRST VIEWPORT (mobile-first): full-bleed black with a bright starfield. A compact
      constellation in the upper-middle; nodes differ in size/weight/state (core largest with
      a yellow ring; live nodes carry a marker). "SERGI MALLÉN" set below in tracked Montserrat
      caps with role + tagline. Wordmark top-left; lang + theme + CV as small HUD corners.
      One hint line: tap a node.
    FORM: full-screen node map with per-element modals. Structure carried from the option-B
      direction; palette and type replaced per the user's brief. 2D canvas, no three.js.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
