    <!--
    IMPECCABLE DIRECTION CONTRACT — canon path (user pinned nicoborja.com as the reference)
    THESIS: The portfolio opens as one living constellation — Sergi's work as a navigable map
      of connected nodes on a starfield, not a stack of hero + cards. Refuses the accent-colour
      icon-grid portfolio and the kinetic-type dark hero. "Net results. No noise."
    OWN-WORLD: Near-black ink (#0A0A0C) under a faint starfield. Bone text (#EDEAE3 / dim
      #9A978F). ONE accent — a restrained magenta (#E0619E) — on active nodes, live-state
      labels, focus and hover only; never as fill or decoration. Spline Sans Mono, wide-tracked
      uppercase, is the interface voice (labels, nav, the wordmark); Spline Sans carries body
      copy. Hairline rules (#23232B) divide; nothing else is ornament. Light and dark themes
      both first-class, toggled top-right.
    STORY: A recruiter, a client and a developer land on the same map. The centre node is
      MallenK; primary nodes — Perfil, Proyectos, Experiencia, Servicios, Contacto — orbit it,
      with real project and company names as satellites. Click a node → the page scrolls to
      that section, each one a quiet, scannable block in the same technical language. Contact
      closes it. Easter eggs stay hidden in the map.
    FIRST VIEWPORT: Full-bleed starfield canvas. A slow force-settled constellation centred
      slightly high; "SERGI MALLÉN" in wide mono caps across the middle with "MallenK" and one
      line of role beneath. Node labels in small tracked mono. Lang + theme toggle top-right;
      "MallenK" wordmark top-left. A single hairline scroll cue lower-centre. No card, no button row.
    FORM: canon of the minimal-WebGL-map personal site, played straight, benchmarked against
      nicoborja.com and the Awwwards personal-portfolio field. 2D canvas (starfield + spring
      constellation) for crispness and GH-Pages budget; no three.js.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
